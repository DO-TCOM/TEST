# ── coturn config pour chaltet.com ───────────────────────────────────────────

# Ports d'écoute
listening-port=3478
tls-listening-port=5349

# IP du VPS — à renseigner sur le serveur directement
# listening-ip=VOTRE_IP
# relay-ip=VOTRE_IP

# Domaine
realm=turn.chaltet.com
server-name=turn.chaltet.com

# Certificats SSL (générés par certbot)
cert=/etc/letsencrypt/live/turn.chaltet.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.chaltet.com/privkey.pem

# Credentials statiques — mot de passe dans /etc/turnserver.conf sur le serveur
# user=chaltet:VOIR_ENV_SERVEUR

# Plage de ports relay UDP
min-port=49152
max-port=65535

# Sécurité
fingerprint
lt-cred-mech
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logs
log-file=/var/log/coturn/turn.log
simple-log
